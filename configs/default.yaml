# All paths are relative to the repository root.
data_dir: data
reports_dir: reports

sources:
  drugcombdb:
    # http://drugcombdb.denglab.org/download/ – DrugCombDB (Liu et al., NAR 2020)
    base_url: http://drugcombdb.denglab.org/download/
    files:
      scored: drugcombs_scored.csv
      drug_info: drug_chemical_info.csv
  depmap:
    # Default: the official Broad release on Figshare+ (CC BY 4.0), pinned for
    # reproducibility. "DepMap 24Q4 Public", doi:10.25452/figshare.plus.27993248.v1
    provider: figshare          # figshare | portal
    figshare_article_id: 27993248
    # portal: https://depmap.org/portal/api/download/files (newest release with all
    # files unless `release` is set). The portal may require browser verification.
    files_index_url: https://depmap.org/portal/api/download/files
    release: null
    files:
      models: Model.csv
      expression: OmicsExpressionProteinCodingGenesTPMLogp1.csv
  pubchem:
    enabled: true            # fallback for drugs DrugCombDB gives no SMILES for
    base_url: https://pubchem.ncbi.nlm.nih.gov/rest/pug
    sleep_s: 0.25
    timeout_s: 30

clean:
  synergy_cutoff: 10         # |ZIP| > 10 => synergistic / antagonistic (same as v1)
  zip_plausible_range: [-100, 100]

features:
  morgan_radius: 2
  morgan_bits: 512
  rna_top_var_genes: 5000
  rna_pca_components: 32
  target_encoding_smoothing: 20

model:
  seed: 42
  n_folds: 5
  eval_folds: 3              # evaluate the first k folds of each scheme (compute budget)
  max_rows: null             # subsample the fact table for quick runs, e.g. 50000
  splits: [random, cold_pair, cold_drug, cold_cell]
  lgbm:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.5
    reg_lambda: 1.0
    verbose: -1
